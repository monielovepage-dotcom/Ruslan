<title>Лой Кратонг вместе</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Charmonman:wght@400;700&family=Mali:wght@400;500&family=Marck+Script&display=swap">
<style>
/* Layout: full-screen 3D riverside at night; objective chip top-left, controls top-right, prompts at the bottom.
   One committed look: a full-moon night lit by candles and lanterns, so the palette is the same in both themes. */
:root{
  color-scheme:dark;
  --night:#0b0d24; --panel:rgba(14,16,42,.78); --line:rgba(246,236,214,.16);
  --text:#f6ecd6; --muted:#b4b2cc;
  --gold:#f2b552; --gold-ink:#3a2506; --lotus:#ef9bb7;
  --paper:#fbf4e4; --ink:#2c2433; --ink-soft:#6c6070; --brass:#a06a24;
  --font-display:"Charmonman","Marck Script","Anuphan",serif;
  --font-ui:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --font-hand:"Mali","Marck Script","Anuphan",cursive;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--font-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.obj{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px 10px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;max-width:min(440px,70vw)}
.obj-step{flex:none;width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.obj-text{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.obj-kicker{font-size:11px;color:var(--muted);letter-spacing:.04em}
.obj-main{font-size:15px;font-weight:500;text-wrap:balance}
.obj.pulse{animation:pulse .8s ease 2}
@keyframes pulse{50%{transform:scale(1.04);border-color:var(--gold)}}
.hud-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"]{color:var(--gold)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:6;transform:translate(-50%,-8px);opacity:0;transition:opacity .35s,transform .35s;text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.t-title{font-family:var(--font-display);font-size:36px;line-height:1.5;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.t-sub{font-size:15px;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#say{position:fixed;left:0;top:0;z-index:4;max-width:min(300px,70vw);background:var(--paper);color:var(--ink);font-family:var(--font-hand);font-size:16px;line-height:1.5;padding:9px 14px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translate(-50%,-100%);opacity:0;transition:opacity .3s;pointer-events:none}
#say.show{opacity:1}
#say::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--paper);border-bottom:0}
#prompt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;max-width:calc(100% - 32px);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.p-text{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.p-type{font-size:11px;color:var(--muted)}
.p-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-btn{flex:none;background:var(--gold);color:var(--gold-ink);font-weight:600;border-radius:999px;padding:9px 18px}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:4;font-size:13px;color:var(--muted);background:rgba(11,13,36,.6);padding:7px 14px;border-radius:999px;white-space:nowrap;transition:opacity .5s;pointer-events:none}
#hint.gone{opacity:0}
#release{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px}
.rel-btn{background:var(--gold);color:var(--gold-ink);font-weight:600;font-size:17px;border-radius:999px;padding:14px 30px;box-shadow:0 10px 30px rgba(242,181,82,.35)}
.rel-note{font-size:13px;color:var(--text);text-shadow:0 1px 8px rgba(0,0,0,.8)}
#count{position:fixed;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
#count span{font-family:var(--font-display);font-size:110px;line-height:1;color:var(--gold);text-shadow:0 4px 30px rgba(0,0,0,.6);animation:pop .9s ease both}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.08);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
#joy{position:fixed;left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:104px;height:104px;border-radius:50%;background:rgba(11,13,36,.55);border:1px solid var(--line);touch-action:none;z-index:5}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(246,236,214,.85)}
@media (pointer:coarse){#prompt,#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 142px)}}
@media (max-width:520px){.t-title{font-size:28px}.obj-main{font-size:14px}#count span{font-size:84px}}
#eyes{position:fixed;inset:0;z-index:15;pointer-events:none;display:grid;place-items:center}
#eyes .lid{position:absolute;left:0;right:0;height:52%;background:#05050c;transition:transform 1s cubic-bezier(.6,0,.3,1)}
#eyes .top{top:0;transform:translateY(-100%);border-radius:0 0 50% 50% / 0 0 30% 30%}
#eyes .bot{bottom:0;transform:translateY(100%);border-radius:50% 50% 0 0 / 30% 30% 0 0}
#eyes.closed .top,#eyes.closed .bot{transform:none}
#eyes .eyes-text{position:relative;font-family:var(--font-display);font-size:28px;opacity:0;transition:opacity .6s .5s;text-align:center;padding:0 24px}
#eyes.closed .eyes-text{opacity:1}
#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 20%,#262a5a 0%,var(--night) 70%);
  padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .7s}
#start.leave{opacity:0;pointer-events:none}
.start-wrap{width:min(420px,100%)}
.invite{position:relative;width:100%;background:var(--paper);color:var(--ink);border-radius:200px 200px 10px 10px;padding:56px 30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.invite::before{content:"";position:absolute;inset:10px;border:1px solid rgba(160,106,36,.45);border-radius:190px 190px 4px 4px;pointer-events:none}
.inv-moon{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 40% 38%,#fffbe8 0%,#f6e4b0 60%,#e8c97a 100%);box-shadow:0 0 30px rgba(242,181,82,.6)}
.inv-kicker{font-size:12px;letter-spacing:.12em;color:var(--brass);font-weight:600}
.inv-title{font-family:var(--font-display);font-size:38px;line-height:1.5;margin:8px 0 4px;text-wrap:balance}
.inv-body{font-family:var(--font-hand);font-size:17px;line-height:1.7;color:var(--ink-soft);margin:0 auto 22px;max-width:30ch}
.btn-primary{background:var(--ink);color:var(--paper);font-weight:600;border-radius:999px;padding:13px 26px}
.btn-primary:disabled{opacity:.55;cursor:progress}
.btn-gold{background:var(--gold);color:var(--gold-ink);font-weight:600;border-radius:999px;padding:12px 22px}
.btn-ghost{border:1.5px solid currentColor;border-radius:999px;padding:10px 18px;font-weight:500;opacity:.85}
.start-hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin-top:18px}
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scrim{position:absolute;inset:0;background:rgba(5,6,18,.78);opacity:0;transition:opacity .3s}
#modal.show .scrim{opacity:1}
.sheet{position:relative;width:100%;max-height:100%;overflow:auto;border-radius:18px;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .3s,transform .3s}
#modal.show .sheet{opacity:1;transform:none}
.sheet .x{position:absolute;top:10px;right:10px;z-index:4}
.sheet-card,.sheet-end{max-width:540px;background:var(--paper);color:var(--ink);padding:28px 28px 24px}
.sheet-end{text-align:center}
.sheet-card .x,.sheet-end .x{color:var(--ink);background:transparent;border-color:rgba(44,36,51,.18)}
.card-kicker{font-size:12px;letter-spacing:.12em;color:var(--brass);font-weight:600;margin:0}
.card-title{font-family:var(--font-display);font-size:32px;line-height:1.5;margin:4px 0 6px;text-wrap:balance}
.card-body{color:var(--ink-soft);line-height:1.75;margin:0}
.wish-input{width:100%;margin-top:16px;min-height:96px;resize:vertical;border:1.5px solid rgba(44,36,51,.2);border-radius:12px;padding:12px 14px;font-family:var(--font-hand);font-size:17px;background:#fffaf0;color:var(--ink)}
.wish-input:focus{outline:2px solid var(--gold);outline-offset:1px}
.wish-note{font-size:12px;color:var(--ink-soft);margin:8px 0 0}
.card-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sheet-letter{max-width:660px}
.env-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 12px 34px;text-align:center}
.env-kicker{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.env{position:relative;width:min(320px,78vw);aspect-ratio:1.5;perspective:900px;margin-top:40px}
.env>*{position:absolute;border-radius:6px}
.env-back{inset:0;background:var(--env);filter:brightness(.78)}
.env-paper{left:7%;right:7%;top:8%;bottom:6%;background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 13px,rgba(80,60,40,.14) 13px 14px);z-index:1;transition:transform .9s .35s cubic-bezier(.2,.8,.2,1)}
.env-front{inset:0;background:var(--env);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:2}
.env-flap{left:0;right:0;top:0;height:58%;background:var(--env);filter:brightness(1.1);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .6s ease;z-index:3}
.env-seal{left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%!important;background:#a8333f;color:#f6d7d0;display:grid;place-items:center;z-index:4;transition:opacity .25s}
.env-seal svg{width:22px;height:22px}
.env.open .env-flap{transform:rotateX(180deg);z-index:0}
.env.open .env-seal{opacity:0}
.env.open .env-paper{transform:translateY(-52%)}
.env-title{font-family:var(--font-display);font-size:28px;margin:12px 0 4px;text-wrap:balance}
.paper{background-color:var(--paper);color:var(--ink);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(80,60,40,.13) 35px 36px);background-position:0 70px;border-radius:8px;padding:30px 34px 26px;box-shadow:0 30px 70px rgba(0,0,0,.45);cursor:pointer}
.paper-kicker{font-size:12px;letter-spacing:.08em;color:var(--brass);font-weight:600;margin:0 0 14px}
.paper-body{font-family:var(--font-hand);font-size:20px;line-height:36px;white-space:pre-wrap;min-height:180px}
.paper-sign{font-family:var(--font-hand);font-size:22px;text-align:right;margin:14px 0 0;opacity:0;transition:opacity .6s}
.paper.done .paper-sign{opacity:1}
.paper-skip{font-size:12px;color:var(--ink-soft);text-align:center;margin:10px 0 0;transition:opacity .4s}
.paper.done .paper-skip{opacity:0}
.sheet-letter .x{color:var(--ink);background:rgba(251,244,228,.9);border-color:rgba(44,36,51,.15)}
.sheet-letter.env-mode .x{color:var(--text);background:var(--panel);border-color:var(--line)}
@media (max-width:520px){.paper{padding:24px 20px 20px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(80,60,40,.13) 31px 32px)}.paper-body{font-size:18px;line-height:32px}}
.souvenir{width:auto;max-width:100%;max-height:46vh;margin:16px auto 6px;display:block;box-shadow:0 14px 34px rgba(0,0,0,.22);transform:rotate(-1.5deg)}
.end-note{font-size:12px;color:var(--ink-soft);margin:8px 0 0}
.end-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>

    const life = FOUNT.on[k], amp = Math.min(1, life / 1.5, (9 - life) / .6);
    for (let n = 0; n < 7 * amp; n++){ const a = Math.random() * TAU, sp = .5 + Math.random() * 1.1; spark(SP_NEAR, p.x, p.y, p.z, Math.cos(a) * sp, 4.2 + Math.random() * 2.2, Math.sin(a) * sp, .7 + Math.random() * .7, Math.random() < .7 ? COL.gold : COL.white, .9, .8); }
    if (Math.random() < dt * 4) Sound.hiss(); });
  FOUNT.light.intensity = any ? 1.4 + Math.random() * .8 : FOUNT.light.intensity * .9;
  const C = FOUNT.crack; if (C.i >= 0 && C.i < KIT.crackers.length){ C.t -= dt; while (C.t <= 0 && C.i < KIT.crackers.length){ const c = KIT.crackers[C.i]; c.visible = false; const p = c.position;
      for (let n = 0; n < 16; n++){ const a = Math.random() * TAU; spark(SP_NEAR, p.x, p.y + .03, p.z, Math.cos(a) * 2, 1 + Math.random() * 2.5, Math.sin(a) * 2, .25 + Math.random() * .2, Math.random() < .5 ? COL.white : COL.warm, .5, 2); }

      if (C.i % 3 === 0) puff(p.x, p.y + .1, p.z, 1, .7); Sound.crack(); C.i++; C.t += .08 + Math.random() * .1; } }
}

}

  const btn = $('#enterBtn'); btn.disabled = false; btn.textContent = 'Иди к пристани'; btn.addEventListener('click', enter);

function enter(){
  Sound.resume(); Sound.setBg(true);
  $('#start').classList.add('leave'); setTimeout(() => { $('#start').hidden = true; }, 700);
  $('#hud').hidden = false; $('#hint').hidden = false; if (coarse) $('#joy').hidden = false;
  started = true; setStep('meet'); canvas.focus({ preventScroll: true });
  setTimeout(() => toast('Ночь полнолуния двенадцатого месяца', `${CFG.from} ждёт у пристани`, 3200), 900);
  setTimeout(() => $('#hint').classList.add('gone'), 9000);
}
requestAnimationFrame(frame);
boot();
</script>

</body></html>
